<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bibliothèque · Mon Petit Français</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#30264c;background:#f8f5ff}*{box-sizing:border-box}body{margin:0}.app{max-width:580px;margin:auto;padding:22px 17px 75px}h1{font-size:26px}h2{font-size:19px}p{line-height:1.55}.muted{color:#80768e;font-size:14px}.panel{background:white;border:1px solid #ece6f5;border-radius:20px;padding:18px;margin:12px 0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tabs button,.secondary{background:white;border:1px solid #ddd1f2;color:#6244a2}.tabs button.active,.primary{background:#7958ca;color:white;border-color:#7958ca}button,a.btn{cursor:pointer;border-radius:13px;padding:12px 14px;font:inherit;text-decoration:none;display:inline-block}button{border:1px solid transparent}button:disabled{opacity:.45;cursor:default}.primary{font-weight:700}.wide{width:100%;margin-top:10px}.card{background:#f1ebff;border:2px solid #e1d4fa;border-radius:20px;min-height:175px;display:grid;place-items:center;text-align:center;padding:25px;cursor:pointer}.card strong{font-size:25px}.card small{display:block;color:#75648f;margin-top:15px}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.choice{display:block;width:100%;margin:8px 0;background:#fff;border:1px solid #ddd1f2;text-align:left}.choice.selected{background:#efe7ff;border-color:#7958ca}.input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #d8cbed;font:inherit;margin:10px 0}.feedback{padding:13px;background:#f0ebff;border-radius:12px;margin:12px 0}.good{background:#e8f7ee}.tag{font-size:12px;font-weight:700;color:#7858c6;text-transform:uppercase}.small{font-size:12px;color:#7e7594}details{border-top:1px solid #eee8f5;padding:12px 0}summary{cursor:pointer;font-weight:650}.stat{font-size:24px;font-weight:800}a{color:#6b4cb4}.hidden{display:none}</style></head><body><main class="app"><a href="index.html">← Terug naar Mon Petit Français</a><h1>Ma bibliothèque 📚</h1><p class="muted">Woordenschat, werkwoorden en grammatica op A2-niveau. Je voortgang wordt op dit toestel bewaard.</p><div class="tabs" id="tabs"></div><div id="main"></div></main><script>
const K='mpf_learning_v1';
const words=[
['Bonjour','Goedendag','Gesprekken'],['Enchantée','Aangenaam','Gesprekken'],['Ensemble','Samen','Gesprekken'],['Souvent','Vaak','Gesprekken'],['Parfois','Soms','Gesprekken'],['Encore','Nog / opnieuw','Gesprekken'],['Peut-être','Misschien','Gesprekken'],['Un compagnon','Een partner','Familie'],['Fiancés','Verloofd','Familie'],['Un chat','Een kat','Familie'],['Une durée déterminée','Een bepaalde periode','Werk'],['Un client','Een klant','Werk'],['Un bureau','Een kantoor','Werk'],['Un projet','Een project','Werk'],['Utile','Nuttig','Werk'],['Apprendre','Leren','Werk'],['Courir','Hardlopen','Vrije tijd'],['Voyager','Reizen','Vrije tijd'],['Cuisiner','Koken','Vrije tijd'],['Des biscuits','Koekjes','Vrije tijd'],['Une comédie musicale','Een musical','Vrije tijd'],['Une journée','Een dag','Dagelijks'],['Aujourd’hui','Vandaag','Dagelijks'],['Demain','Morgen','Dagelijks'],['Hier','Gisteren','Dagelijks'],['Fatiguée','Moe (vrouwelijk)','Dagelijks'],['Stressée','Gestrest (vrouwelijk)','Dagelijks'],['Un rendez-vous','Een afspraak','Dagelijks'],['Comprendre','Begrijpen','Gesprekken'],['Une question','Een vraag','Gesprekken']
].map((x,i)=>({id:'w'+i,fr:x[0],nl:x[1],theme:x[2]}));
const verbs=[
{name:'être',nl:'zijn',present:['suis','es','est','sommes','êtes','sont'],part:'été',aux:'avoir'},
{name:'avoir',nl:'hebben',present:['ai','as','a','avons','avez','ont'],part:'eu',aux:'avoir'},
{name:'aller',nl:'gaan',present:['vais','vas','va','allons','allez','vont'],part:'allé',aux:'être'},
{name:'faire',nl:'doen / maken',present:['fais','fais','fait','faisons','faites','font'],part:'fait',aux:'avoir'},
{name:'parler',nl:'spreken',present:['parle','parles','parle','parlons','parlez','parlent'],part:'parlé',aux:'avoir'},
{name:'travailler',nl:'werken',present:['travaille','travailles','travaille','travaillons','travaillez','travaillent'],part:'travaillé',aux:'avoir'},
{name:'apprendre',nl:'leren',present:['apprends','apprends','apprend','apprenons','apprenez','apprennent'],part:'appris',aux:'avoir'},
{name:'pouvoir',nl:'kunnen',present:['peux','peux','peut','pouvons','pouvez','peuvent'],part:'pu',aux:'avoir'},
{name:'vouloir',nl:'willen',present:['veux','veux','veut','voulons','voulez','veulent'],part:'voulu',aux:'avoir'},
{name:'prendre',nl:'nemen',present:['prends','prends','prend','prenons','prenez','prennent'],part:'pris',aux:'avoir'}
];
const persons=['je','tu','il / elle','nous','vous','ils / elles'];
const theory=[
{title:'Le présent · tegenwoordige tijd',body:'Gebruik de présent voor wat nu gebeurt of regelmatig gebeurt.',example:'Je travaille chez différents clients. (Ik werk bij verschillende klanten.)'},
{title:'Le passé composé · verleden tijd',body:'Gebruik avoir of être in de présent + een voltooid deelwoord. Bij être past het deelwoord zich meestal aan het onderwerp aan.',example:'J’ai travaillé. / Je suis allée au bureau.'},
{title:'Le futur proche · nabije toekomst',body:'Gebruik aller in de présent + een infinitief.',example:'Je vais apprendre le français. (Ik ga Frans leren.)'},
{title:'L’imparfait · onvoltooid verleden tijd',body:'Gebruik de imparfait vaak voor gewoontes en beschrijvingen in het verleden. Neem de nous-vorm van de présent, verwijder -ons en voeg -ais, -ais, -ait, -ions, -iez, -aient toe. Être is onregelmatig.',example:'Quand j’étais petite, j’aimais dessiner.'},
{title:'La négation · ontkenning',body:'Plaats ne en pas rond het vervoegde werkwoord. Voor een klinker wordt ne meestal n’.',example:'Je ne parle pas souvent français.'},
{title:'Les questions · vragen stellen',body:'Je kunt een vraag maken met intonatie of met est-ce que.',example:'Tu parles français ? / Est-ce que tu parles français ?'},
{title:'Les articles · lidwoorden',body:'Le en la zijn bepaalde lidwoorden; un en une zijn onbepaalde lidwoorden. Voor een klinker worden le en la meestal l’.',example:'Un client, une cliente, le bureau, l’école.'},
{title:'Les prépositions · voorzetsels',body:'Bij een stad gebruik je meestal à. Chez betekent bij iemand of bij een organisatie. Pour betekent voor.',example:'J’habite à De Pinte. Je travaille chez un client.'}
];
let data;try{data=JSON.parse(localStorage.getItem(K))||{}}catch(e){data={}};if(!data.known)data.known={};if(!data.stats)data.stats={correct:0,total:0};if(!data.hard)data.hard={};
let tab='vocab',mode='cards',theme='Alle thema’s',index=0,flipped=false,question=null,selected='',checked=false;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(K,JSON.stringify(data)),normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,'').trim().replace(/\s+/g,' ');
function filtered(){return words.filter(w=>theme==='Alle thema’s'||w.theme===theme)}
function header(){let tabs=[['vocab','Vocabulaire'],['verbs','Verbes'],['times','Les temps'],['theory','Théorie'],['review','Révision']];$('tabs').innerHTML=tabs.map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" data-tab="'+k+'">'+v+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;index=0;question=null;render()})}
function render(){header();if(tab==='vocab')vocab();if(tab==='verbs')verbView();if(tab==='times')timeView();if(tab==='theory')theoryView();if(tab==='review')review()}
function vocab(){let ws=filtered();if(index>=ws.length)index=0;let w=ws[index];$('main').innerHTML='<div class="panel"><label class="tag">Thema</label><select id="theme">'+['Alle thema’s',...new Set(words.map(x=>x.theme))].map(t=>'<option '+(theme===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select><div class="row"><button id="cards" class="'+(mode==='cards'?'primary':'secondary')+'">Flashcards</button><button id="quiz" class="'+(mode==='quiz'?'primary':'secondary')+'">Meerkeuze</button><button id="fill" class="'+(mode==='fill'?'primary':'secondary')+'">Invullen</button></div></div><div id="exercise"></div>'; $('theme').onchange=e=>{theme=e.target.value;index=0;question=null;render()};['cards','quiz','fill'].forEach(m=>$(m).onclick=()=>{mode=m;question=null;render()});if(mode==='cards'){ $('exercise').innerHTML='<p class="muted">Kaart '+(index+1)+' van '+ws.length+' · '+Object.keys(data.known).filter(k=>data.known[k]).length+' gekende woorden</p><div class="card" id="flip"><div><strong>'+esc(flipped?w.nl:w.fr)+'</strong><small>Raak de kaart aan om te draaien</small></div></div><div class="row"><button class="secondary" id="again">Nog oefenen</button><button class="primary" id="known">Ken ik ✓</button></div><button class="secondary wide" id="next">Volgende →</button>'; $('flip').onclick=()=>{flipped=!flipped;render()};$('again').onclick=()=>{data.known[w.id]=false;save();advance()};$('known').onclick=()=>{data.known[w.id]=true;save();advance()};$('next').onclick=advance;}else quizView(ws)}
function advance(){index=(index+1)%filtered().length;flipped=false;question=null;render()}
function quizView(ws){let w=ws[index];if(!question||question.id!==w.id){question=w;selected='';checked=false}let others=words.filter(x=>x.id!==w.id&&x.nl!==w.nl).sort((a,b)=>a.id.localeCompare(b.id)).slice((index*3)%20,(index*3)%20+3);let options=[w.nl,...others.map(x=>x.nl)].sort((a,b)=>a.localeCompare(b));$('exercise').innerHTML='<div class="panel"><span class="tag">Vraag '+(index+1)+' / '+ws.length+'</span><h2>Wat betekent « '+esc(w.fr)+' »?</h2>'+(mode==='quiz'?options.map(o=>'<button class="choice '+(selected===o?'selected':'')+'" data-answer="'+esc(o)+'">'+esc(o)+'</button>').join(''):'<input class="input" id="answer" placeholder="Schrijf de Nederlandse betekenis..." value="'+esc(selected)+'">')+'<button class="primary wide" id="check">'+(checked?'Volgende →':'Controleer')+'</button><div id="fb"></div></div>';if(mode==='quiz')document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(!checked){selected=b.dataset.answer;quizView(ws)}});else $('answer').oninput=e=>selected=e.target.value;$('check').onclick=()=>{if(checked){advance();return}if(!selected.trim())return;checked=true;let ok=normalize(selected)===normalize(w.nl);data.stats.total++;if(ok)data.stats.correct++;else data.hard[w.id]=(data.hard[w.id]||0)+1;save();$('fb').innerHTML='<div class="feedback '+(ok?'good':'')+'">'+(ok?'✓ Correct!':'Juiste antwoord: '+esc(w.nl))+'</div>';$('check').textContent='Volgende →'} }
function verbView(){$('main').innerHTML='<div class="panel"><p class="muted">Kies een werkwoord en oefen de présent.</p><select id="verb">'+verbs.map((v,i)=>'<option value="'+i+'">'+v.name+' · '+v.nl+'</option>').join('')+'</select><div id="verbdetail"></div></div>';let n=0;function detail() {let v=verbs[n];$('verbdetail').innerHTML='<h2>'+v.name+'</h2><p class="muted">Passé composé: '+v.aux+' + '+v.part+'</p>'+persons.map((p,i)=>'<div style="padding:9px;border-bottom:1px solid #eee">'+esc(p)+' <strong>'+esc(v.present[i])+'</strong></div>').join('')+'<h3>Oefen een vervoeging</h3><p>'+persons[index%6]+' ______ ('+v.name+')</p><input class="input" id="verbanswer" placeholder="Vul de vervoeging in"><button class="primary wide" id="verbcheck">Controleer</button><div id="verbfb"></div><button class="secondary wide" id="verbnext">Andere persoon →</button>';$('verbcheck').onclick=()=>{let ok=normalize($('verbanswer').value)===normalize(v.present[index%6]);data.stats.total++;if(ok)data.stats.correct++;save();$('verbfb').innerHTML='<div class="feedback '+(ok?'good':'')+'">'+(ok?'✓ Correct!':'Juiste antwoord: '+v.present[index%6])+'</div>'};$('verbnext').onclick=()=>{index++;detail()}}$('verb').onchange=e=>{n=+e.target.value;index=0;detail()};detail()}
function timeView(){$('main').innerHTML='<div class="panel"><h2>Werkwoordstijden</h2><p class="muted">Leer wanneer je een tijd gebruikt en bekijk voorbeelden.</p>'+theory.slice(0,4).map(t=>'<details><summary>'+esc(t.title)+'</summary><p>'+esc(t.body)+'</p><div class="feedback">'+esc(t.example)+'</div></details>').join('')+'</div>'}
function theoryView(){$('main').innerHTML='<div class="panel"><h2>Grammatica A2</h2>'+theory.map(t=>'<details><summary>'+esc(t.title)+'</summary><p>'+esc(t.body)+'</p><div class="feedback">'+esc(t.example)+'</div></details>').join('')+'</div>'}
function review(){let difficult=words.filter(w=>data.hard[w.id]&&!data.known[w.id]);let pending=words.filter(w=>!data.known[w.id]);$('main').innerHTML='<div class="panel"><h2>Mijn voortgang</h2><div class="row"><div><div class="stat">'+Object.values(data.known).filter(Boolean).length+'/'+words.length+'</div><div class="muted">Woordjes gekend</div></div><div><div class="stat">'+(data.stats.total?Math.round(100*data.stats.correct/data.stats.total):0)+'%</div><div class="muted">Correct in oefeningen</div></div></div><p class="muted">Moeilijke woorden: '+difficult.length+'</p><button class="primary wide" id="rev">Herhaal onbekende woorden ('+pending.length+')</button><button class="secondary wide" id="backup">Exporteer leergegevens</button><label class="secondary wide btn" style="text-align:center">Importeer leergegevens<input type="file" id="import" accept=".json" style="display:none"></label><p class="small">Deze leergegevens worden apart bewaard van je bestaande app. Bewaar een back-up als je browsergegevens wist.</p></div>';$('rev').onclick=()=>{tab='vocab';mode='cards';theme='Alle thema’s';index=Math.max(0,words.findIndex(w=>!data.known[w.id]));render()};$('backup').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='mon-petit-francais-bibliotheque.json';a.click();URL.revokeObjectURL(u)};$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d||typeof d.known!=='object'||typeof d.stats!=='object')throw Error('Ongeldige back-up');if(confirm('Huidige leergegevens vervangen?')){data=d;save();render()}}catch(e){alert('Import mislukt: '+e.message)}}}
render();
</script></body></html>
