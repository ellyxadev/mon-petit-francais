const spokenPracticeLesson20261112={"id":"gesprek-2026-11-12","title":"Frans praten en begrijpen","icon":"🗣️","desc":"Echte gesprekken, cursus, werk en handige reacties","questions":[{"type":"choice","prompt":"Wat betekent « Tu peux répéter ? »?","options":["Kun je herhalen?","Wat bedoel je?","Kun je helpen?"],"answer":"Kun je herhalen?","explanation":"Tu peux répéter ? is informeel. Formeel: Pouvez-vous répéter, s'il vous plaît ?"},{"type":"translate","prompt":"Wat bedoel je? (informeel)","answer":"Qu'est-ce que tu veux dire ?","explanation":"Dit vraagt naar de betekenis. Tu peux répéter ? vraagt om herhaling."},{"type":"fill","prompt":"Je ne comprends ___ .","answer":"pas","explanation":"Je ne comprends pas = ik begrijp het niet."},{"type":"choice","prompt":"Hoe zeg je beleefd: Kunt u dat herhalen, alstublieft?","options":["Pouvez-vous répéter, s'il vous plaît ?","Qu'est-ce que vous dire ?","Tu veux répéter ?"],"answer":"Pouvez-vous répéter, s'il vous plaît ?","explanation":"Pouvez-vous is de formele vraagvorm."},{"type":"fill","prompt":"J'arrive ___ trois minutes.","answer":"dans","explanation":"Dans trois minutes = over drie minuten. Niet à trois minutes."},{"type":"choice","prompt":"Welke zin is natuurlijk voor 'Ik kom over drie minuten aan'?","options":["J'arrive dans trois minutes.","J'arrivais dans trois minutes.","J'arrive à trois minutes."],"answer":"J'arrive dans trois minutes.","explanation":"De tegenwoordige tijd kan een nabije toekomst uitdrukken. J'arrivais is verleden tijd."},{"type":"translate","prompt":"Het klinkt beter.","answer":"Ça sonne mieux","explanation":"Sonner = klinken. Ça sonne mieux = het klinkt beter."},{"type":"fill","prompt":"Je vais suivre un ___ aujourd'hui au travail.","answer":"cours","explanation":"Un cours is mannelijk: een cursus of les."},{"type":"choice","prompt":"Welke vorm betekent 'Ik heb een cursus gevolgd'?","options":["J'ai suivi un cours.","J'ai suivre un cours.","J'ai suivrai un cours."],"answer":"J'ai suivi un cours.","explanation":"Suivre = volgen, suivi = gevolgd, je suivrai = ik zal volgen."},{"type":"translate","prompt":"Ik heb vandaag op het werk een cursus gevolgd.","answer":"J'ai suivi un cours aujourd'hui au travail","accept":["Aujourd'hui, j'ai suivi un cours au travail"],"explanation":"J'ai suivi is de passé composé van suivre."},{"type":"fill","prompt":"C'était ___ l'adaptabilité.","answer":"sur","explanation":"Sur betekent hier over. Zonder accent; sûr betekent zeker."},{"type":"choice","prompt":"Wat betekent « C'était sur l'adaptabilité »?","options":["Het ging over aanpassingsvermogen.","Het was zeker moeilijk.","Het ging over flexibiliteit in mijn agenda."],"answer":"Het ging over aanpassingsvermogen.","explanation":"C'était = het was; sur = over; l'adaptabilité = het aanpassingsvermogen."},{"type":"translate","prompt":"Het was heel interessant.","answer":"C'était très intéressant","explanation":"C'était = het was. C'est = het is."},{"type":"fill","prompt":"Je ne sais pas encore de ___ .","answer":"quoi","explanation":"De quoi = waarover. Je ne sais pas encore de quoi = ik weet nog niet waarover."},{"type":"translate","prompt":"We zullen wel zien.","answer":"On verra","explanation":"Een heel natuurlijke reactie als je nog niet weet wat er gaat gebeuren."},{"type":"choice","prompt":"Wat betekent « Qu'est-ce que tu fais maintenant ? »?","options":["Wat doe je nu?","Wat heb je vandaag gedaan?","Wat ga je morgen doen?"],"answer":"Wat doe je nu?","explanation":"Maintenant = nu. Tu fais = je doet."},{"type":"translate","prompt":"Ik ben op het werk.","answer":"Je suis au travail","explanation":"Je suis au travail = ik ben op het werk. Je travaille = ik werk."},{"type":"fill","prompt":"Je ___ dans ma voiture.","answer":"conduis","explanation":"Je conduis = ik bestuur/rijd. Je roule is ook mogelijk voor ik rijd."},{"type":"choice","prompt":"Welke zin is het natuurlijkst voor 'Ik rijd en praat met jou'?","options":["Je conduis et je te parle.","Je conduis et je parle à toi.","Je suis conduis et je parle."],"answer":"Je conduis et je te parle.","explanation":"Je te parle is de gewone vorm voor ik praat met jou."},{"type":"translate","prompt":"Ik ben niet moe. (vrouwelijke vorm)","answer":"Je ne suis pas fatiguée","explanation":"Ne ... pas maakt de zin ontkennend. Fatiguée met -e."},{"type":"choice","prompt":"Wat betekent « Est-ce que tu as aimé ce cours ? »?","options":["Vond je deze cursus leuk?","Ga je deze cursus volgen?","Heb je deze cursus gegeven?"],"answer":"Vond je deze cursus leuk?","explanation":"Tu as aimé = je vond leuk, verleden tijd."},{"type":"fill","prompt":"C'était très intéressant ___ c'est utile.","answer":"parce que","explanation":"Parce que = omdat. Let op: deze oefening vraagt twee woorden."},{"type":"translate","prompt":"Het is nuttig voor toekomstige projecten.","answer":"C'est utile pour de futurs projets","accept":["C'est utile pour les projets futurs"],"explanation":"Utile = nuttig; de futurs projets = toekomstige projecten."},{"type":"choice","prompt":"Wat betekent « Et pourquoi ? »?","options":["En waarom?","En wanneer?","En waar?"],"answer":"En waarom?","explanation":"Pourquoi = waarom. Handig om gesprekken verder te voeren."},{"type":"fill","prompt":"Je veux ___ en français.","answer":"penser","explanation":"Penser en français = in het Frans denken. Je veux = ik wil."},{"type":"choice","prompt":"Welke reactie betekent 'Ik begrijp de vraag niet'?","options":["Je ne comprends pas la question.","Je ne comprends la question.","Je ne sais pas question."],"answer":"Je ne comprends pas la question.","explanation":"Bij ne hoort hier pas. La question = de vraag."},{"type":"translate","prompt":"Ik heb een drukke dag, maar het gaat.","answer":"J'ai une journée chargée, mais ça va","explanation":"Une journée chargée = een drukke dag. Mais ça va = maar het gaat."},{"type":"choice","prompt":"Wat betekent « Et ta journée ? »?","options":["En jouw dag?","En jouw werk?","En morgen?"],"answer":"En jouw dag?","explanation":"Een natuurlijke korte vraag aan een collega."},{"type":"translate","prompt":"Ik praat met jou.","answer":"Je te parle","explanation":"Je te parle is natuurlijker dan je parle à toi in een neutrale zin."}]};
const lessons20261113=[{"id":"competences-2026-11-13","title":"Mijn competenties en sollicitaties","icon":"💼","desc":"Sterke punten, Leonardo en advies geven · A2","questions":[{"type":"choice","prompt":"Wat betekent « mes points forts »?","options":["Mijn sterke punten","Mijn werkuren","Mijn problemen"],"answer":"Mijn sterke punten","explanation":"Un point fort is een sterk punt; mes points forts is meervoud."},{"type":"translate","prompt":"Ik ben consultant, dus ik moet vaak over mijn vaardigheden praten.","answer":"Je suis consultante, donc je dois souvent parler de mes compétences","explanation":"Donc = dus; je dois = ik moet; mes compétences = mijn vaardigheden."},{"type":"fill","prompt":"Je sais ___ des données. (analyseren)","answer":"analyser","explanation":"Na je sais gebruik je het hele werkwoord: je sais analyser."},{"type":"choice","prompt":"Wat betekent « l'adaptabilité »?","options":["Aanpassingsvermogen","Leiderschap","Tijdbeheer"],"answer":"Aanpassingsvermogen","explanation":"L'adaptabilité is een belangrijke vaardigheid voor een consultant."},{"type":"translate","prompt":"Hij kan langzaam en duidelijk spreken.","answer":"Il peut parler lentement et clairement","explanation":"Il peut + infinitief; lentement = langzaam, clairement = duidelijk."},{"type":"fill","prompt":"Il peut ___ des exemples concrets. (geven)","answer":"donner","explanation":"Donner des exemples concrets = concrete voorbeelden geven."},{"type":"choice","prompt":"Hoe zeg je: Ik weet niet meer wat ik moet zeggen?","options":["Je ne sais plus quoi dire","Je ne peux pas encore parler","Je ne sais jamais dire"],"answer":"Je ne sais plus quoi dire","explanation":"Ne ... plus betekent niet meer; quoi dire = wat zeggen."},{"type":"translate","prompt":"Hij moet eerlijk zijn over zijn vaardigheden.","answer":"Il doit être honnête sur ses compétences","explanation":"Il doit + infinitief; être honnête = eerlijk zijn."},{"type":"choice","prompt":"Wat betekent « un entretien d'embauche »?","options":["Een sollicitatiegesprek","Een teamvergadering","Een opleiding"],"answer":"Een sollicitatiegesprek","explanation":"Een entretien d'embauche is een sollicitatiegesprek."},{"type":"fill","prompt":"Je travaille bien en ___. (team)","answer":"équipe","explanation":"Travailler en équipe = in teamverband werken."}]},{"id":"grammaire-2026-11-13","title":"Werkwoordgroepen en adjectieven","icon":"📘","desc":"Présent, -er/-ir en mannelijk/vrouwelijk · A2","questions":[{"type":"choice","prompt":"Tot welke groep behoort « travailler »?","options":["1e groep (-er)","2e groep (-ir)","3e groep"],"answer":"1e groep (-er)","explanation":"Werkwoorden op -er behoren meestal tot de eerste groep, behalve aller."},{"type":"fill","prompt":"Marco ___ mieux en équipe. (travailler)","answer":"travaille","explanation":"Marco = il. Bij een regelmatig -er-werkwoord eindigt il op -e."},{"type":"fill","prompt":"Joanna ___ clairement. (communiquer)","answer":"communique","explanation":"Joanna = elle; elle communique."},{"type":"fill","prompt":"Pierre et Fatou ___ souvent. (voyager)","answer":"voyagent","explanation":"Pierre et Fatou = ils; ils voyagent."},{"type":"choice","prompt":"Welke vorm is correct?","options":["Nous voyageons","Nous voyagons","Nous voyages"],"answer":"Nous voyageons","explanation":"Bij voyager staat een extra e vóór -ons om de zachte g-klank te bewaren."},{"type":"choice","prompt":"Welke vorm hoort bij « nous » van finir?","options":["Nous finissons","Nous finons","Nous finissent"],"answer":"Nous finissons","explanation":"Finir is een regelmatig werkwoord uit de tweede groep."},{"type":"choice","prompt":"Tot welke groep behoort « résoudre »?","options":["3e groep","1e groep","2e groep"],"answer":"3e groep","explanation":"Résoudre is onregelmatig en behoort tot de derde groep."},{"type":"fill","prompt":"Il ___ les problèmes rapidement. (résoudre)","answer":"résout","explanation":"Je résous, tu résous, il résout."},{"type":"fill","prompt":"Amara est très ___. (motivé, vrouwelijk)","answer":"motivée","explanation":"In het vrouwelijk krijgt motivé een extra -e."},{"type":"fill","prompt":"Rajan est ___. (organisé, mannelijk)","answer":"organisé","explanation":"Mannelijk enkelvoud: organisé."},{"type":"choice","prompt":"Welke vorm gebruik je voor een vrouw?","options":["Je suis créative","Je suis créatif","Je suis créatifs"],"answer":"Je suis créative","explanation":"-if verandert in -ive bij het vrouwelijk."},{"type":"fill","prompt":"Marie et Fatima sont ___. (sportif)","answer":"sportives","explanation":"Vrouwelijk meervoud: sportif → sportive → sportives."},{"type":"choice","prompt":"Welke zin is correct voor een vrouw?","options":["Je suis adaptable","Je suis adaptablée","Je suis adaptables"],"answer":"Je suis adaptable","explanation":"Adaptable eindigt al op -e en verandert niet tussen mannelijk en vrouwelijk enkelvoud."}]}];
function mergeConversationLessons(data){if(!data||!Array.isArray(data.lessons))return data;if(!data.lessons.some(l=>l.id===conversationLesson20261112.id))data.lessons.push(structuredClone(conversationLesson20261112));if(!data.lessons.some(l=>l.id===courseLesson20261112.id))data.lessons.push(structuredClone(courseLesson20261112));if(!data.lessons.some(l=>l.id===spokenPracticeLesson20261112.id))data.lessons.push(structuredClone(spokenPracticeLesson20261112));for(const lesson of lessons20261113){if(!data.lessons.some(l=>l.id===lesson.id))data.lessons.push(structuredClone(lesson))}return data}
function fresh(){return {xp:0,answered:0,correct:0,history:{},days:[],goal:5,lessons:structuredClone(starter)}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.lessons)&&Array.isArray(d.days))return mergeConversationLessons(d)}catch(e){}return mergeConversationLessons(fresh())}
let state=load(),tab='home',session=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’]/g,"'").replace(/[.!?,;:]/g,'').replace(/\s+/g,' ').trim();
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dailyCount(){return state.days.find(x=>x.date===today())?.count||0}function streak(){let map=new Set(state.days.filter(x=>x.count>0).map(x=>x.date)),d=new Date(),n=0;if(!map.has(today()))d.setDate(d.getDate()-1);while(map.has(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))){n++;d.setDate(d.getDate()-1)}return n}
function level(){return Math.floor(state.xp/100)+1}function qid(l,i){return l.id+':'+i}function allQuestions(){return state.lessons.flatMap(l=>l.questions.map((q,i)=>({lesson:l,index:i,q,key:qid(l,i)})))}function missed(){return allQuestions().filter(x=>(state.history[x.key]?.wrong||0)>(state.history[x.key]?.reviewed||0))}
function render(){ $('headerXP').textContent='✦ '+state.xp+' XP';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home')home();if(tab==='practice')practice();if(tab==='progress')progress();if(tab==='settings')settings()}
function home(){let count=dailyCount(),m=missed().length;$('content').innerHTML=`<div class="hero"><div style="font-size:13px;opacity:.9">BONSOIR, KATRIJN ✨</div><h1>Un petit pas en français</h1><p>Een beetje Frans, op jouw tempo. Oefen met woorden en zinnen die je zelf hebt gebruikt.</p><button class="primary" style="background:white;color:#6945b4" id="startAll">Begin met oefenen →</button></div><div class="stats"><div class="stat"><strong>🔥 ${streak()}</strong><span>Dagen streak</span></div><div class="stat"><strong>✦ ${state.xp}</strong><span>XP verdiend</span></div><div class="stat"><strong>🎓 ${level()}</strong><span>Niveau</span></div></div><div class="panel"><div class="row"><b>Dagelijks doel</b><span class="muted">${Math.min(count,state.goal)}/${state.goal} vragen</span></div><div class="progress"><div style="width:${Math.min(100,count/state.goal*100)}%"></div></div><div class="small">${count>=state.goal?'Je hebt je dagdoel gehaald!':'Nog '+Math.max(0,state.goal-count)+' vragen om je dagdoel te halen.'}</div></div><h2 class="section">Jouw lessen</h2><div id="lessons"></div>${m?`<button class="secondary" id="review">↻ Herhaal ${m} moeilijke vragen</button>`:''}`;$('startAll').onclick=()=>start(allQuestions());$('lessons').innerHTML=state.lessons.map((l,i)=>`<button class="lesson" data-lesson="${i}"><div class="emoji">${esc(l.icon||'📘')}</div><div><strong>${esc(l.title)}</strong><small>${esc(l.desc||'')} · ${l.questions.length} vragen</small></div><span class="arrow">›</span></button>`).join('');document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>start(state.lessons[+b.dataset.lesson].questions.map((q,i)=>({lesson:state.lessons[+b.dataset.lesson],index:i,q,key:qid(state.lessons[+b.dataset.lesson],i)}))));if(m)$('review').onclick=()=>start(missed())}
function start(items){if(!items.length)return;session={items:items.slice(),pos:0,selected:'',checked:false,wasRight:false,points:0,misses:0,repeat:0};tab='practice';render()}
function practice(){if(!session){$('content').innerHTML=`<h2 class="section">Oefenen</h2><div class="panel"><h3>Kies een oefening</h3><p class="muted">Een mix van vertalen, meerkeuze en invullen.</p><button class="primary" id="all">Alle lessen oefenen</button><button class="secondary" id="hard">Moeilijke vragen (${missed().length})</button></div>`;$('all').onclick=()=>start(allQuestions());$('hard').onclick=()=>start(missed().length?missed():allQuestions());return}if(session.pos>=session.items.length){let p=session.points,m=session.misses;$('content').innerHTML=`<div class="hero" style="text-align:center"><div style="font-size:40px">🏆</div><h1>Bravo, bien joué !</h1><p>Je hebt ${p} vragen juist beantwoord en ${p*10} XP verdiend.</p></div><div class="panel"><b>${m?'Je fouten komen opnieuw terug':'Alle vragen goed!'}</b><p class="muted">${m?'Je kunt je moeilijke vragen meteen opnieuw oefenen.':'Kies een nieuwe les of ga terug naar Home.'}</p><button class="primary" id="again">${missed().length?'Herhaal mijn fouten':'Nog een ronde'}</button><button class="secondary" id="back">Terug naar Home</button></div>`;$('again').onclick=()=>start(missed().length?missed():allQuestions());$('back').onclick=()=>{session=null;tab='home';render()};return}
let {q}=session.items[session.pos],pct=session.pos/session.items.length*100;$('content').innerHTML=`<div style="margin-top:25px" class="row"><span class="tag">${esc(q.type==='choice'?'Kies het juiste antwoord':q.type==='fill'?'Vul het woord in':'Vertaal naar het Frans')}</span><span class="muted">${session.pos+1}/${session.items.length}</span></div><div class="progress"><div style="width:${pct}%"></div></div><h2 class="question">${esc(q.prompt)}</h2><div id="answerArea"></div><div id="feedbackArea"></div><button class="primary" id="action" disabled>Controleer</button><button class="secondary" id="quit">Stop oefening</button>`;
let area=$('answerArea');if(q.type==='choice'){area.innerHTML=q.options.map((o,i)=>`<button class="choice" data-opt="${i}">${esc(o)}</button>`).join('');area.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(session.checked)return;session.selected=q.options[+b.dataset.opt];area.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));$('action').disabled=false})}else{area.innerHTML=`<input class="input" id="response" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Schrijf je antwoord...">`;let inp=$('response');inp.value=session.selected;inp.oninput=()=>{session.selected=inp.value;$('action').disabled=!inp.value.trim()};$('action').disabled=!session.selected.trim()}
$('action').onclick=()=>{if(!session.checked)checkAnswer();else next()};$('quit').onclick=()=>{session=null;tab='home';render()}}
function checkAnswer(){let item=session.items[session.pos],q=item.q,valid=[q.answer,...(q.accept||[])].map(norm);let ok=valid.includes(norm(session.selected));session.checked=true;session.wasRight=ok;let hist=state.history[item.key]||{wrong:0,reviewed:0};if(ok){session.points++;state.xp+=10;if(hist.wrong>hist.reviewed)hist.reviewed++}else{session.misses++;hist.wrong++;if(session.repeat<2){session.items.push(item);session.repeat++}}state.history[item.key]=hist;state.answered++;if(ok)state.correct++;let d=state.days.find(x=>x.date===today());if(!d){d={date:today(),count:0};state.days.push(d)}d.count++;save();let fb=$('feedbackArea');fb.innerHTML=`<div class="feedback ${ok?'good':''}"><b>${ok?'✓ Goed gedaan!':'↻ Nog even oefenen'}</b>${ok?'':`<div style="margin-top:7px">Juiste antwoord: <strong>${esc(q.answer)}</strong></div>`}<div style="margin-top:8px">${esc(q.explanation)}</div></div>`;if(q.type==='choice')document.querySelectorAll('.choice').forEach(b=>{let val=q.options[+b.dataset.opt];b.classList.toggle('correct',val===q.answer);b.classList.toggle('wrong',val===session.selected&&!ok)});else $('response').disabled=true;$('action').textContent='Volgende →';$('action').disabled=false}
function next(){session.pos++;session.selected='';session.checked=false;render()}
function progress(){let total=state.answered,accuracy=total?Math.round(state.correct/total*100):0;$('content').innerHTML=`<h2 class="section">Mijn voortgang</h2><div class="stats"><div class="stat"><strong>${state.xp}</strong><span>Totale XP</span></div><div class="stat"><strong>${level()}</strong><span>Niveau</span></div><div class="stat"><strong>${accuracy}%</strong><span>Juist</span></div></div><div class="panel"><b>Naar niveau ${level()+1}</b><div class="progress"><div style="width:${state.xp%100}%"></div></div><div class="small">${state.xp%100}/100 XP voor het volgende niveau</div></div><h2 class="section">Leerstatistieken</h2><div class="panel"><div class="row"><span>Beantwoorde vragen</span><b>${total}</b></div><hr style="border:0;border-top:1px solid #eee8f4"><div class="row"><span>Moeilijke vragen</span><b>${missed().length}</b></div><hr style="border:0;border-top:1px solid #eee8f4"><div class="row"><span>Huidige streak</span><b>${streak()} dagen</b></div><hr style="border:0;border-top:1px solid #eee8f4"><div class="row"><span>Vandaag geoefend</span><b>${dailyCount()} vragen</b></div></div><button class="primary" id="rev">Herhaal moeilijke vragen</button>`;$('rev').onclick=()=>start(missed().length?missed():allQuestions())}
function settings(){$('content').innerHTML=`<h2 class="section">Instellingen & back-up</h2><div class="panel"><b>Dagelijks leerdoel</b><p class="muted">Aantal beantwoorde vragen per dag</p><select class="input" id="goal"><option value="3">3 vragen</option><option value="5">5 vragen</option><option value="10">10 vragen</option><option value="15">15 vragen</option><option value="20">20 vragen</option></select><p class="small">Je streak telt dagen waarop je minstens één vraag hebt beantwoord.</p></div><h2 class="section">Mijn gegevens</h2><div class="panel"><b>Back-up maken</b><p class="small">Download je lessen, XP en voortgang als JSON-bestand. Bewaar dit bijvoorbeeld in Google Drive.</p><button class="secondary" id="export">↓ Exporteer back-up</button><label class="file">↑ Importeer bestaande back-up<input id="backup" type="file" accept=".json,application/json"></label><p class="small">Een back-up importeren vervangt de huidige gegevens.</p></div><h2 class="section">Nieuwe lessen</h2><div class="panel"><b>Lespakket importeren</b><p class="small">Importeer nieuwe oefeningen uit een JSON-bestand. Bestaande lessen blijven behouden, tenzij een les dezelfde ID heeft.</p><label class="file">＋ Importeer lespakket<input id="lessonsFile" type="file" accept=".json,application/json"></label><button class="secondary" id="sample">↓ Download voorbeeld-lespakket</button><details><summary class="small">JSON-formaat bekijken</summary><pre>${esc(JSON.stringify({lessons:[{id:'nieuw',title:'Nieuwe les',icon:'📗',desc:'Een oefenles',questions:[{type:'translate',prompt:'Goedemorgen',answer:'Bonjour',explanation:'Bonjour is een begroeting.'}]}]},null,2))}</pre></details></div><h2 class="section">Opslag</h2><div class="panel"><p class="small" id="storage">Voortgang wordt opgeslagen in de lokale browseropslag (localStorage) van deze webapp. Dit synchroniseert niet tussen toestellen. Bij wissen van sitegegevens kan je voortgang verdwijnen. Maak regelmatig een back-up.</p></div>`;$('goal').value=String(state.goal);$('goal').onchange=e=>{state.goal=+e.target.value;save()};$('export').onclick=()=>download(state,'mon-petit-francais-backup-'+today()+'.json');$('sample').onclick=()=>download({lessons:[{id:'extra',title:'Extra les',icon:'📗',desc:'Mijn nieuwe Franse woorden',questions:[{type:'translate',prompt:'Ik begrijp het.',answer:'Je comprends',explanation:'Comprendre betekent begrijpen.'},{type:'fill',prompt:'Je ___ français.',answer:'parle',explanation:'Je parle is de tegenwoordige tijd van parler.'}]}]},'voorbeeld-lespakket.json');$('backup').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d||!Array.isArray(d.lessons)||!Array.isArray(d.days)||typeof d.xp!=='number')throw Error('Ongeldige back-up');if(confirm('Je huidige gegevens vervangen door deze back-up?')){state=d;save();alert('Back-up geïmporteerd');render()}}catch(err){alert('Import mislukt: '+err.message)}};$('lessonsFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.lessons)||!d.lessons.length)throw Error('Geen lessen gevonden');for(let l of d.lessons){if(typeof l.id!=='string'||!Array.isArray(l.questions)||!l.questions.length||l.questions.some(q=>!['choice','fill','translate'].includes(q.type)||!q.answer||!q.prompt||(q.type==='choice'&&!Array.isArray(q.options))))throw Error('Ongeldig lesformaat')}for(let l of d.lessons){let i=state.lessons.findIndex(x=>x.id===l.id);if(i>=0)state.lessons[i]=l;else state.lessons.push(l)}save();alert(d.lessons.length+' les(sen) geïmporteerd');render()}catch(err){alert('Import mislukt: '+err.message)}}}
function download(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;session=null;render()});save();render();
</script></body></html>
